name: Bug report
description: Something went wrong — behaviour, crash, wrong fallback, stuck breaker
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Three details decide most of these cases, so
        please fill in as much as you can — a report with them is usually fixed
        the same day.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what actually happened.
      placeholder: |
        Expected: the chain falls back to the next target after eco returns 400.
        Actual: the whole turn failed with INVALID_REQUEST.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "`npm ls @magic6/dsh-llm-resilience` in your profile, or the number in the market."
      placeholder: "0.5.6"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version and how you run it
      description: The harness version, plus `web` / `desktop` / `headless` / `tui`.
      placeholder: "0.2.1-rc.2, dsh web, macOS 26 arm64"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      description: This plugin's Windows and macOS behaviour differs in real ways (path handling, file locking), so it matters.
      placeholder: "Windows 11 x64 / macOS 26 arm64 / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: The error, verbatim
      description: |
        The exact `code` and `message` from the failure, not a paraphrase.
        Session logs carry them: `plugin:llm-fallback` records and
        `assistant/attempt` → `finish.reason.failure`.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your `llm-fallback` config
      description: |
        The relevant block from your profile's `cordis.patch.yml`.
        **Remove API keys and base URLs you do not want public.**
      render: yaml
    validations:
      required: false

  - type: textarea
    id: state
    attributes:
      label: Breaker state (if the chain skipped a target)
      description: |
        `$DSH_HOME/storages/llm-resilience/state.json` — or the `stateFile` you
        configured. This is what says whether a target is locked and why.
      render: json
    validations:
      required: false
