name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test

  # Windows 必须单独跑一遍：2026-11-25 在真实 Win11 上跑测试时才暴露出
  # 「断言写死 POSIX 路径前缀、产品代码用 path.join」这类只在 Windows 挂的
  # 测试。CI 只有 ubuntu 时这永远不会被发现，而用户就在 Windows 上用这些插件。
  # 只跑一个 node 版本：平台差异是这里要测的东西，node 版本已由上面覆盖。
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  # 端到端：真的起一个 dsh、加载这个包、让它去请求行为已知的假 provider。
  # 单元测试里的 adapter 是假的，证明不了「用户装到的包 + 真宿主 + 真 HTTP 故障」
  # 这条路 —— 2026-11-24 那两个 bug 都是只有真流量才会暴露的。
  # 需要的只是 npm 上的 dsh；不需要任何 API key（假 provider 指向 127.0.0.1）。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # DSH 0.2.2 的 engines 要求 node >=24.9；用 22 会在 `dsh plugin add`
          # 阶段就被拒绝。单元测试矩阵仍覆盖 20/22，这里只负责真宿主。
          node-version: 24
      - run: npm install --no-audit --no-fund
      # dsh plugin add 会把参数原样转给 pnpm；runner 默认没有。
      - run: npm install --global pnpm@11
      # 装一个确定版本的 dsh 供 e2e 使用，避免 runner 上恰好没有。
      - run: npm install --global @deepseek-ai/dsh@0.2.2-rc.5
      - name: Run e2e scenarios
        run: e2e/run.sh
